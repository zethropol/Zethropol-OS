<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Configuration 1.0//EN" "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.zethropol.Update"/>
    <allow send_destination="org.zethropol.Update"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="GetUpdateState"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="ListPendingUpdates"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="GetOperationState"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
