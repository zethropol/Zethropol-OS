<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Configuration 1.0//EN" "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.zethropol.Update"/>
    <allow send_destination="org.zethropol.Update"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="GetUpdateState"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="ListPendingUpdates"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="GetOperationState"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="GetPostUpdateState"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="PreviewTransaction"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="PreviewPlan"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="TriggerUpdate"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="ReviewAurSelection"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="GetAurReadiness"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="ReserveAurBuild"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="GetAurBuildContext"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="PreviewAurReceipt"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="InstallAur"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="CancelAur"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.zethropol.Update.v1" send_member="GetAurOperationState"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.zethropol.Update" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
