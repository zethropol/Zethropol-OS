<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.zethropol.ZciDaemon"/>
    <allow send_destination="org.zethropol.ZciDaemon"/>
    <allow send_destination="org.zethropol.ZciDaemon" send_interface="org.zethropol.ZciDaemon.v1"/>
    <allow receive_sender="org.zethropol.ZciDaemon" receive_type="signal"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.zethropol.ZciDaemon"/>
    <allow send_destination="org.zethropol.ZciDaemon" send_interface="org.zethropol.ZciDaemon.v1"/>
    <allow receive_sender="org.zethropol.ZciDaemon" receive_type="signal"/>
  </policy>
</busconfig>
